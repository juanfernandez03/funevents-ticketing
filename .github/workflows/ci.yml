name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Latest .NET 10 SDK; global.json accepts any 10.0 feature band.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # API tests start PostgreSQL with Testcontainers; Docker is available on GitHub-hosted runners.
      - name: Test
        run: dotnet test --no-build --configuration Release
